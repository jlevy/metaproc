  - bead_id: is-01kyxw263bdz2f224czw8veymn
    client_id: 8a8381cc-cad0-4dcf-b18b-2a34a5e5e475
    kind: create_issue
    patch:
      description: "Metaproc 0.2.0 was published through OIDC trusted publishing, but uv
        publish does not generate PEP 740 attestations, so PyPI exposes no provenance
        objects for the wheel or sdist. Replace or augment the publish step with an
        attestation-producing path and verify both Integrity API objects. PyPI
        recommends pypa/gh-action-pypi-publish; the latest reviewed-safe older action
        v1.14.0 pins pyasn1 0.6.1, which is rejected by this repo vulnerability policy,
        while v1.14.2 was published 2026-07-29 and is still inside the 14-day cool-off.
        Do not bypass policy: revisit after 2026-08-12T19:31:27Z, review and SHA-pin the
        action (or a pypi-attestations alternative), then exercise it on the next
        release."
      parentId: 183d3df7-4221-46b0-b2d1-a68e60b12612
      priority: 2
      status: open
      title: Add PyPI attestations to the Metaproc release workflow
