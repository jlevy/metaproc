# Git hooks managed by Lefthook.
# Install once with `make hooks-install`.

pre-commit:
  parallel: false
  commands:
    ruff-format:
      glob: "*.py"
      run: uv --config-file uv.toml run --frozen ruff format {staged_files}
      stage_fixed: true

    ruff-check:
      glob: "*.py"
      run: uv --config-file uv.toml run --frozen ruff check --fix {staged_files}
      stage_fixed: true

    browser-format:
      glob: "*.{js,mjs,css,json}"
      exclude: "src/metaproc/metabrowser_plugin/plugin/elk.bundled.js"
      run: npm run format:browser
      stage_fixed: true

    browser-types:
      glob: "*.{js,mjs,json}"
      run: npm run check:browser

    codespell:
      glob: "*.{py,md}"
      run: uv --config-file uv.toml run --frozen codespell --write-changes {staged_files}
      stage_fixed: true

    format-markdown:
      glob: "*.md"
      run: make format-markdown
      stage_fixed: true

pre-push:
  commands:
    verify:
      # Git exports repository-local variables to hooks. Tests that create
      # fixture repositories must not inherit them and mutate this checkout.
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_OBJECT_DIRECTORY -u GIT_ALTERNATE_OBJECT_DIRECTORIES make verify
