# Keep resolution-affecting settings project-owned. The Makefile and CI select this
# file explicitly so user- or system-level uv settings cannot make uv.lock nonportable.
required-version = ">=0.12.0,<0.13"
exclude-newer = "14 days"

[exclude-newer-package]
flowmark-rs = "2026-07-16T00:00:00Z"
frontmatter-format = "2026-08-01T01:27:00Z"
kpress = "2026-07-16T00:00:00Z"
metabrowser = "2026-07-18T00:00:00Z"
# softschema 0.7.0 published 2026-08-25T07:31:06Z. It is an audited first-party
# exception for stable structural error codes and enforced composed schemas.
softschema = "2026-08-25T07:32:00Z"
