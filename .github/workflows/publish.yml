name: Publish to PyPI

on:
  release:
    types: [published]

env:
  UV_EXCLUDE_NEWER: "14 days"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11.26"
          checksum: "6426a73c3837e6e2483ee344cbc00f36394d179afcba6183cb77437e67db4af0"
          enable-cache: false
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"

      - name: Set up Python
        run: uv python install

      - name: Run the complete release gate
        run: make verify

      - name: Verify release tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Refusing to publish non-release tag: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          expected="${RELEASE_TAG#v}"
          actual="$(uv --config-file uv.toml run --frozen python -c 'from importlib.metadata import version; print(version("metaproc"))')"
          if [ "$actual" != "$expected" ]; then
            printf 'Release version mismatch: expected %s from tag %s, got %s\n' \
              "$expected" "$RELEASE_TAG" "$actual" >&2
            exit 1
          fi

      - name: Publish to PyPI
        run: uv --config-file uv.toml publish --trusted-publishing always
