name: Publish to PyPI

on:
  release:
    types: [published]

env:
  # Use only the checked-in resolution policy so ambient runner configuration cannot
  # make uv.lock appear stale or alter dependency selection.
  UV_CONFIG_FILE: uv.toml
  # Supply-chain cool-off: only consider releases older than this, so the publish
  # build never resolves packages too new to have been vetted. The uv 0.12 line
  # required by uv.toml and pinned below accepts a relative duration directly. See
  # SUPPLY-CHAIN-SECURITY.md.
  UV_EXCLUDE_NEWER: "14 days"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout release tag
        # Pinned to a full commit SHA (see SUPPLY-CHAIN-SECURITY.md); bump
        # deliberately when updating.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        # Pinned to a full commit SHA (see note in ci.yml).
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          # uv-x86_64-unknown-linux-gnu.
          checksum: "600cf9a742aca00d292673b16b5acffaa7b8c269a364ad0c2e79498dcb1fe101"
          # Release workflows do not restore or save shared caches, reducing
          # cache-poisoning exposure in this privileged OIDC job.
          enable-cache: false
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.19.0"

      - name: Set up Python
        run: uv python install

      - name: Run the complete release gate
        run: make verify

      - name: Verify release tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Refusing to publish non-release tag: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          expected="${RELEASE_TAG#v}"
          actual="$(uv --config-file uv.toml run --frozen python -c 'from importlib.metadata import version; print(version("metaproc"))')"
          if [ "$actual" != "$expected" ]; then
            printf 'Release version mismatch: expected %s from tag %s, got %s\n' \
              "$expected" "$RELEASE_TAG" "$actual" >&2
            exit 1
          fi

      - name: Publish to PyPI
        run: uv --config-file uv.toml publish --trusted-publishing always
