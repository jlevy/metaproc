name: CI

on:
  push:
    branches: ["main"]
  # Deliberately unfiltered by base branch. Filtering on `main` meant a pull request
  # stacked on another pull request reported no checks at all -- not a failure, just
  # silence, which reads exactly like a gate that has not run yet. The gate should
  # answer for every proposed change, and the branch a change is proposed against is
  # not a reason to skip it.
  pull_request:

permissions:
  contents: read

env:
  # Use only the checked-in resolution policy so ambient runner configuration cannot
  # make uv.lock appear stale or alter dependency selection.
  UV_CONFIG_FILE: uv.toml
  # Supply-chain cool-off: only consider releases older than this, so CI never
  # resolves packages too new to have been vetted. The uv 0.12 line required by
  # uv.toml and pinned below accepts a relative duration directly. See
  # SUPPLY-CHAIN-SECURITY.md.
  UV_EXCLUDE_NEWER: "14 days"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Pinned to a full commit SHA (see SUPPLY-CHAIN-SECURITY.md); bump
        # deliberately when updating.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        # Pinned to a full commit SHA. Bump the action, uv version, and Linux
        # checksum together when updating.
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          # uv-x86_64-unknown-linux-gnu; update for another matrix OS/arch.
          checksum: "600cf9a742aca00d292673b16b5acffaa7b8c269a364ad0c2e79498dcb1fe101"
          enable-cache: true
          # Retain downloaded wheels in the shared cache to reduce PyPI load.
          # This is setup-uv v9's default, made explicit for future upgrades.
          prune-cache: false
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.19.0"
          cache: "npm"

      - name: Set up Python
        run: uv python install

      - name: Run quality gates and audits
        run: make lint-check audit

  test:
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          checksum: "600cf9a742aca00d292673b16b5acffaa7b8c269a364ad0c2e79498dcb1fe101"
          enable-cache: true
          # Retain downloaded wheels in the shared cache to reduce PyPI load.
          # This is setup-uv v9's default, made explicit for future upgrades.
          prune-cache: false
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.19.0"
          cache: "npm"

      - name: Set up Python
        run: uv python install

      - name: Run tests
        run: make test

  distribution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          checksum: "600cf9a742aca00d292673b16b5acffaa7b8c269a364ad0c2e79498dcb1fe101"
          enable-cache: true
          prune-cache: false
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.19.0"
          cache: "npm"

      - name: Set up Python
        run: uv python install

      - name: Validate source and wheel distributions
        run: make build
